<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>历史人物版MBTI对照表 · 访问验证</title>
<style>
  :root{
    --ink:#33222a; --paper:#fcf0f4; --card:#fff8fa;
    --accent:#c2547a; --accent-deep:#96395c; --muted:#8a6d78;
    --line:rgba(51,34,42,.14); --chip-bg:#f6dde6; --chip-fg:#96395c;
    --hero1:#4a2130; --hero2:#2c1019; --hero-ink:#fcf0f4; --page:#150a0f;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--page);color:var(--ink);display:flex;justify-content:center;min-height:100vh;
  }
  .app{width:100%;max-width:480px;min-height:100vh;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.5);}
  .serif{font-family:"Songti SC","STSongti","Noto Serif SC","SimSun",serif;}
  .screen{display:none;min-height:100vh;padding:32px 24px 40px;position:relative;}
  .screen.active{display:block;animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}

  .btn{display:block;width:100%;border:none;cursor:pointer;padding:16px;border-radius:14px;font-size:17px;font-weight:600;letter-spacing:2px;transition:transform .12s ease,opacity .2s;}
  .btn:active{transform:scale(.97);}
  .btn-gold{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.25);}
  .btn-ghost{background:transparent;border:1.5px solid var(--ink);color:var(--ink);}

  #screen-gate{display:none;flex-direction:column;}
  #screen-gate.active{display:flex;}
  .wrap{margin:auto;width:100%;}
  .brand-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:3px;color:var(--accent-deep);opacity:.85;}
  .brand-row .line{flex:1;height:1px;background:var(--accent);opacity:.5;margin:0 10px;}
  .poster{margin:34px 0 26px;border:1px solid var(--accent);background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:18px;padding:36px 26px 28px;position:relative;overflow:hidden;}
  .poster::after{content:attr(data-mark);position:absolute;right:-16px;bottom:-30px;font-size:110px;color:rgba(255,255,255,.06);font-family:"Songti SC","STSongti","Noto Serif SC",serif;font-weight:700;}
  .poster .kicker{font-size:12px;letter-spacing:5px;color:var(--accent);margin-bottom:16px;}
  .poster h1{font-size:30px;line-height:1.45;font-weight:700;letter-spacing:2px;}
  .poster h1 em{font-style:normal;color:var(--accent);}
  .poster .sub{margin-top:14px;font-size:13px;line-height:1.9;color:var(--hero-ink);opacity:.75;}
  .poster .stamp{position:absolute;top:18px;right:18px;width:56px;height:56px;border:2px solid currentColor;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1.3;text-align:center;transform:rotate(8deg);font-family:"Songti SC","STSongti",serif;font-weight:700;opacity:.85;}

  .gate-card{border:1px solid var(--line);border-radius:18px;background:var(--card);padding:24px 20px;}
  .gate-card .lock-ico{font-size:32px;text-align:center;margin-bottom:10px;}
  .gate-card h2{font-size:19px;letter-spacing:2px;text-align:center;margin-bottom:6px;}
  .gate-card .hint{font-size:12.5px;color:var(--muted);text-align:center;line-height:1.8;margin-bottom:18px;}
  .code-input{width:100%;padding:15px 16px;border:1.5px solid var(--line);border-radius:12px;font-size:18px;letter-spacing:3px;text-align:center;background:var(--card);color:var(--ink);outline:none;font-family:"SF Mono",Menlo,Consolas,monospace;}
  .code-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,0,0,.06);}
  .gate-err{color:var(--accent);font-size:13px;text-align:center;margin-top:12px;min-height:20px;letter-spacing:1px;}
  .gate-card.shake{animation:shake .4s;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
  .gate-note{text-align:center;font-size:12px;color:var(--muted);margin-top:16px;line-height:1.9;}

  #screen-start{display:none;flex-direction:column;}
  #screen-start.active{display:flex;}
  .meta-row{display:flex;gap:10px;margin-bottom:26px;}
  .meta-pill{flex:1;text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px 6px;background:var(--card);}
  .meta-pill b{display:block;font-size:16px;margin-bottom:4px;}
  .meta-pill span{font-size:11.5px;color:var(--muted);}
  .start-note{text-align:center;font-size:12px;color:var(--muted);margin-top:14px;line-height:1.8;}

  .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .q-head .back{border:none;background:none;font-size:22px;color:var(--ink);cursor:pointer;padding:4px 8px;visibility:hidden;}
  .q-head .back.show{visibility:visible;}
  .progress-track{flex:1;height:5px;background:var(--line);border-radius:4px;margin:0 14px;overflow:hidden;}
  .progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-deep));border-radius:4px;transition:width .35s ease;}
  .q-count{font-size:12px;color:var(--muted);min-width:42px;text-align:right;}
  .q-title{font-size:23px;line-height:1.6;font-weight:700;margin:14px 4px 26px;letter-spacing:1px;}
  .q-title .q-mark{color:var(--accent-deep);}
  .opt{display:block;width:100%;text-align:left;margin-bottom:14px;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:17px 18px;font-size:15.5px;line-height:1.55;color:var(--ink);cursor:pointer;transition:all .18s ease;}
  .opt:active,.opt.picked{border-color:var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.12);transform:scale(.985);}

  #screen-loading{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  #screen-loading.active{display:flex;}
  .loader-ring{width:86px;height:86px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin-bottom:34px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .load-text{font-size:18px;letter-spacing:2px;margin-bottom:10px;min-height:26px;}
  .load-sub{font-size:13px;color:var(--muted);letter-spacing:1px;}

  .report{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.18);}
  .report-head{background:linear-gradient(160deg,var(--hero1),var(--hero2));color:var(--hero-ink);padding:22px 22px 20px;}
  .report-head .lab{font-size:10.5px;letter-spacing:4px;color:var(--accent);}
  .report-head .no{font-size:11px;color:var(--hero-ink);opacity:.5;margin-top:6px;letter-spacing:1px;}
  .r-hero{display:flex;align-items:center;gap:18px;margin-top:18px;}
  .r-emoji{width:72px;height:72px;border-radius:50%;flex:none;background:rgba(255,255,255,.12);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:38px;}
  .r-name{font-size:26px;font-weight:700;letter-spacing:2px;line-height:1.3;}
  .r-tag{font-size:12.5px;color:var(--accent);margin-top:6px;letter-spacing:1px;}
  .r-body{padding:22px;}
  .r-sec{margin-bottom:24px;}
  .r-sec h3{font-size:13px;letter-spacing:3px;color:var(--accent-deep);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .r-sec h3::after{content:"";flex:1;height:1px;background:var(--line);}
  .r-sec p{font-size:14.5px;line-height:1.9;color:var(--ink);opacity:.9;}
  .radar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px;}
  .radar-row .nm{width:104px;flex:none;color:var(--ink);opacity:.85;font-size:12.5px;}
  .radar-track{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden;}
  .radar-fill{height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent-deep));width:0;transition:width 1s ease .3s;}
  .radar-row .pct{width:40px;text-align:right;color:var(--muted);font-size:12px;}
  .item-card{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;background:var(--paper);}
  .item-card b{display:block;font-size:14.5px;margin-bottom:6px;}
  .item-card .desc{font-size:13.5px;line-height:1.8;color:var(--ink);opacity:.85;margin-bottom:8px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-size:10.5px;padding:3px 9px;border-radius:20px;background:var(--chip-bg);color:var(--chip-fg);letter-spacing:.5px;}
  .quote-box{border-left:3px solid var(--accent);padding:12px 16px;background:var(--paper);border-radius:0 10px 10px 0;font-family:"Songti SC","STSongti","Noto Serif SC",serif;font-size:15px;line-height:1.8;}
  .action-box{background:var(--hero2);color:var(--hero-ink);border-radius:12px;padding:16px 18px;}
  .action-box .lab{font-size:11px;letter-spacing:3px;color:var(--accent);margin-bottom:8px;}
  .action-box p{color:var(--hero-ink);opacity:.9;font-size:14px;line-height:1.8;}

  /* 朋友圈 */
  .feed-item{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px;}
  .feed-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .feed-av{width:38px;height:38px;border-radius:8px;background:var(--chip-bg);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none;}
  .feed-nm{font-size:14px;font-weight:600;color:var(--accent-deep);}
  .feed-tm{font-size:11px;color:var(--muted);margin-top:2px;}
  .feed-tx{font-size:14px;line-height:1.7;white-space:pre-wrap;}
  .feed-likes{font-size:12px;color:var(--muted);margin-top:10px;padding-top:8px;border-top:1px solid var(--line);}
  .feed-likes b{color:var(--accent-deep);}
  .feed-cmts{margin-top:8px;background:var(--card);border-radius:8px;padding:8px 10px;}
  .feed-cmt{font-size:12.5px;line-height:1.7;margin-bottom:4px;}
  .feed-cmt b{color:var(--accent-deep);}

  /* 聊天 */
  .chat-item{margin-bottom:14px;}
  .chat-nm{font-size:11px;color:var(--muted);margin-bottom:5px;}
  .chat-item.r{text-align:right;}
  .chat-bubble{display:inline-block;max-width:82%;padding:11px 14px;border-radius:14px;font-size:14px;line-height:1.65;text-align:left;background:var(--paper);border:1px solid var(--line);}
  .chat-item.r .chat-bubble{background:linear-gradient(135deg,var(--accent),var(--accent-deep));color:#fff;border:none;}

  /* 表格 */
  .tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
  .tbl th,.tbl td{border:1px solid var(--line);padding:8px 10px;text-align:left;line-height:1.5;}
  .tbl th{background:var(--chip-bg);color:var(--chip-fg);font-weight:600;}

  .report-foot{padding:16px 22px 20px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);letter-spacing:1px;}
  .after-actions{margin-top:18px;display:flex;gap:10px;}
  .after-actions .btn{padding:14px 10px;font-size:14px;letter-spacing:1px;}
  .foot-tip{text-align:center;font-size:11px;color:var(--muted);margin-top:26px;letter-spacing:1px;line-height:1.8;}
</style>
</head>
<body>
<div class="app">

  <section class="screen active" id="screen-gate">
    <div class="wrap">
      <div class="brand-row"><span id="gBrand1"></span><span class="line"></span><span id="gBrand2"></span></div>
      <div class="poster" id="gPoster" data-mark="鉴">
        <div class="kicker" id="gKicker"></div>
        <h1 class="serif" id="gTitle"></h1>
        <p class="sub" id="gSub"></p>
      </div>
      <div class="gate-card" id="gateCard">
        <div class="lock-ico">🔑</div>
        <h2 class="serif">输入访问口令</h2>
        <p class="hint" id="gHint"></p>
        <input class="code-input" id="codeInput" type="password" inputmode="text" autocomplete="off" placeholder="请输入口令" aria-label="访问口令">
        <div class="gate-err" id="gateErr"></div>
        <button class="btn btn-gold" id="gateBtn" style="margin-top:14px;" onclick="submitCode()">验 证 并 进 入</button>
      </div>
      <p class="gate-note" id="gNote"></p>
    </div>
  </section>

  <section class="screen" id="screen-start">
    <div class="wrap">
      <div class="brand-row"><span id="sBrand1"></span><span class="line"></span><span id="sBrand2"></span></div>
      <div class="poster" id="sPoster" data-mark="鉴">
        <div class="stamp" id="sStamp"></div>
        <div class="kicker" id="sKicker"></div>
        <h1 class="serif" id="sTitle"></h1>
        <p class="sub" id="sSub"></p>
      </div>
      <div class="meta-row" id="sMeta"></div>
      <button class="btn btn-gold" id="sBtn" onclick="startQuiz()">开 始</button>
      <p class="start-note" id="sNote"></p>
    </div>
    <p class="foot-tip" id="sFoot"></p>
  </section>

  <section class="screen" id="screen-quiz">
    <div class="q-head">
      <button class="back" id="btn-back" onclick="prevQ()">‹</button>
      <div class="progress-track"><div class="progress-bar" id="pbar"></div></div>
      <div class="q-count" id="qcount"></div>
    </div>
    <h2 class="q-title serif" id="qtitle"></h2>
    <div id="opts"></div>
  </section>

  <section class="screen" id="screen-loading">
    <div class="loader-ring"></div>
    <div class="load-text serif" id="loadText"></div>
    <div class="load-sub" id="loadSub"></div>
  </section>

  <section class="screen" id="screen-result">
    <div class="report">
      <div class="report-head">
        <div class="lab" id="rLab"></div>
        <div class="no" id="reportNo"></div>
        <div class="r-hero">
          <div class="r-emoji" id="rEmoji"></div>
          <div>
            <div class="r-name serif" id="rName"></div>
            <div class="r-tag" id="rTag"></div>
          </div>
        </div>
      </div>
      <div class="r-body" id="rBody"></div>
      <div class="report-foot">
        <span id="fLeft"></span>
        <span>第 <b id="fSerial"></b> 份</span>
      </div>
    </div>
    <div class="after-actions">
      <button class="btn btn-ghost" onclick="restart()">再 测 一 次</button>
      <button class="btn btn-gold" onclick="shareResult()">分 享 给 朋 友</button>
    </div>
  </section>

</div>

<script>
/* ================= 主题（每个测试只改这一块） ================= */
const THEME = {
  brand1:'HML · 009', brand2:'恋爱人格',
  gateKicker:'ANCIENT LOVE PERSONA', gateTitle:'你的古代<br><em>恋爱人格</em>',
  gateSub:'10 道题，测出你在感情里是哪种人，<br>并匹配一位同款古人。',
  gateHint:'付款后获取的专属口令，验证通过即可开始',
  gateNote:'口令在付款后由发放方私信发送<br>如无法打开，请联系发你链接的人核实',
  mark:'缘',
  stamp:'恋爱<br>人格',
  sub:'10 道题，按你在感情里的真实反应作答。<br>不是教你怎么谈，<br><b>是告诉你在爱里像谁。</b>',
  meta:[{b:'10题',s:'约2分钟'},{b:'8型',s:'恋爱人格'},{b:'1位',s:'同款古人'}],
  btn:'测 我 的 恋 爱 人 格',
  note:'按第一反应作答，结果没有对错<br>建议截图保存，@那个最懂你的人来看',
  foot:'本测试为娱乐工具，爱情没有标准答案',
  reportLab:'ANCIENT LOVE PERSONA REPORT',
  reportPrefix:'LP-',
  footLeft:'恋爱人格研究所',
  loadLines:['正在读取你的心动模式…','比对八种恋爱人格…','翻查古人情史档案…','锁定跟你同款的那个人…'],
  loadSub:'十道题正在心动',
  sharePre:'我的古代恋爱人格是「',
  sharePost:'」，你也测测自己在爱里像谁'
};

/* ================= 加密题库加载（不明文出现在本页） ================= */
let QUESTIONS = [], TYPES = {}, AXES = null, SHOW_MAPPING = false;
let ENC = null;
const STORE_KEY = 'tst_ck@' + location.pathname;

const b64ToBuf = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
const bufToB64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const $ = id => document.getElementById(id);

async function unwrapContentKey(code){
  const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(code), 'PBKDF2', false, ['deriveKey']);
  for(const w of ENC.keys){
    try{
      const wrapKey = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64ToBuf(w.salt), iterations:w.iter, hash:'SHA-256' }, baseKey, { name:'AES-GCM', length:256 }, false, ['decrypt']);
      const raw = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64ToBuf(w.iv) }, wrapKey, b64ToBuf(w.ct));
      return new Uint8Array(raw);
    }catch(e){}
  }
  return null;
}
async function decryptContent(ckBytes){
  const ck = await crypto.subtle.importKey('raw', ckBytes, 'AES-GCM', false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64ToBuf(ENC.payload.iv) }, ck, b64ToBuf(ENC.payload.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
function applyContent(data){
  QUESTIONS = data.QUESTIONS; TYPES = data.TYPES;
  AXES = data.AXES || null; SHOW_MAPPING = !!data.SHOW_MAPPING;
}
async function enterWithCode(code, remember){
  const ck = await unwrapContentKey(code.trim());
  if(!ck) return false;
  applyContent(await decryptContent(ck));
  if(remember){ try{ localStorage.setItem(STORE_KEY, bufToB64(ck)); }catch(e){} }
  return true;
}

async function boot(){
  if(/[?&](forget|logout|reset)=1/.test(location.search)){
    try{ localStorage.removeItem(STORE_KEY); }catch(e){}
    history.replaceState(null,'',location.pathname);
  }
  try{ ENC = await (await fetch('data.enc.json', {cache:'no-store'})).json(); }
  catch(e){ $('gateErr').textContent = '内容加载失败，请检查网络后刷新'; return; }
  let saved = null;
  try{ saved = localStorage.getItem(STORE_KEY); }catch(e){}
  if(saved){
    try{ applyContent(await decryptContent(b64ToBuf(saved))); show('screen-start'); return; }
    catch(e){ try{ localStorage.removeItem(STORE_KEY); }catch(_){} }
  }
  const m = location.hash.match(/[#&]k=([^&]+)/);
  if(m){
    const code = decodeURIComponent(m[1]);
    $('codeInput').value = code;
    if(await enterWithCode(code, true)){ history.replaceState(null,'',location.pathname); show('screen-start'); return; }
  }
  $('codeInput').focus();
}

let gateBusy = false, failCount = 0;
async function submitCode(){
  if(gateBusy) return;
  const code = $('codeInput').value.trim();
  if(!code){ $('gateErr').textContent='请先输入访问口令'; return; }
  gateBusy = true;
  const btn = $('gateBtn'); btn.textContent='验 证 中…'; btn.style.opacity=.7;
  const ok = await enterWithCode(code, true);
  btn.textContent='验 证 并 进 入'; btn.style.opacity=1; gateBusy=false;
  if(ok){ history.replaceState(null,'',location.pathname); show('screen-start'); }
  else{
    failCount++;
    $('gateErr').textContent = '口令不正确，请注意大小写（第'+failCount+'次尝试）';
    const card=$('gateCard'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    $('codeInput').select();
  }
}
document.addEventListener('DOMContentLoaded', ()=>{
  $('codeInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitCode(); });
  paintTheme();
  boot();
});

/* ================= 主题渲染 ================= */
function paintTheme(){
  document.title = THEME.gateTitle.replace(/<[^>]+>/g,'');
  $('gBrand1').textContent=$('sBrand1').textContent=THEME.brand1;
  $('gBrand2').textContent=$('sBrand2').textContent=THEME.brand2;
  $('gKicker').textContent=THEME.gateKicker;
  $('gTitle').innerHTML=THEME.gateTitle;
  $('gSub').innerHTML=THEME.gateSub;
  $('gHint').textContent=THEME.gateHint;
  $('gNote').innerHTML=THEME.gateNote;
  $('gPoster').dataset.mark=THEME.mark;
  $('sPoster').dataset.mark=THEME.mark;
  $('sStamp').innerHTML=THEME.stamp;
  $('sKicker').textContent=THEME.gateKicker;
  $('sTitle').innerHTML=THEME.gateTitle;
  $('sSub').innerHTML=THEME.sub;
  $('sBtn').textContent=THEME.btn;
  $('sNote').innerHTML=THEME.note;
  $('sFoot').textContent=THEME.foot;
  $('sMeta').innerHTML=THEME.meta.map(m=>'<div class="meta-pill"><b>'+m.b+'</b><span>'+m.s+'</span></div>').join('');
  $('rLab').textContent=THEME.reportLab;
  $('fLeft').textContent=THEME.footLeft;
  $('loadSub').textContent=THEME.loadSub;
}

/* ================= 流程 ================= */
let cur = 0, deck = [], answers = [];
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function buildDeck(){ return shuffle(QUESTIONS).map(q=>({ q:q.q, opts:shuffle(q.opts) })); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); $(id).classList.add('active'); window.scrollTo(0,0); }
function startQuiz(){ deck = buildDeck(); answers = new Array(deck.length).fill(null); cur=0; renderQ(); show('screen-quiz'); }
function restart(){ location.reload(); }
function renderQ(){
  const item = deck[cur];
  $('qcount').textContent = (cur+1)+' / '+deck.length;
  $('pbar').style.width = (cur/deck.length*100)+'%';
  $('qtitle').innerHTML = '<span class="q-mark">「</span>'+item.q+'<span class="q-mark">」</span>';
  $('btn-back').classList.toggle('show', cur>0);
  const box = $('opts'); box.innerHTML='';
  item.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt'+(answers[cur]===i?' picked':'');
    b.textContent=o.t;
    b.onclick=()=>pick(i);
    box.appendChild(b);
  });
}
function pick(i){
  answers[cur]=i;
  document.querySelectorAll('.opt').forEach((el,idx)=>el.classList.toggle('picked',idx===i));
  setTimeout(()=>{ if(cur<deck.length-1){ cur++; renderQ(); } else { $('pbar').style.width='100%'; analyze(); } }, 220);
}
function prevQ(){ if(cur>0){ cur--; renderQ(); } }

function analyze(){
  show('screen-loading');
  let i=0;
  $('loadText').textContent=THEME.loadLines[0];
  const timer=setInterval(()=>{
    i++;
    if(i<THEME.loadLines.length){ $('loadText').textContent=THEME.loadLines[i]; }
    else{ clearInterval(timer); buildResult(); }
  }, 620);
}

function tally(){
  const scores={};
  Object.keys(TYPES).forEach(k=>scores[k]=0);
  if(AXES){
    const ax={}; Object.keys(AXES).forEach(a=>ax[a]=0);
    answers.forEach((ai,qi)=>{ if(ai===null) return; const p=deck[qi].opts[ai].p; for(const a in p) ax[a]=(ax[a]||0)+p[a]; });
    return { axes:ax };
  }
  answers.forEach((ai,qi)=>{ if(ai===null) return; const p=deck[qi].opts[ai].p; for(const k in p) scores[k]+=p[k]; });
  return { scores };
}

let resultKey=null;
function buildResult(){
  const t=tally();
  let autoBlocks=[];
  if(AXES){
    let code='', rows=[];
    const axisCount = QUESTIONS.length / Object.keys(AXES).length;
    for(const a in AXES){
      const sum=t.axes[a]||0;
      const first=sum>=0? AXES[a][0] : AXES[a][1];
      code += first;
      const pctFirst = Math.round((sum + axisCount) / (2*axisCount) * 100);
      rows.push({name:AXES[a][0]+' '+({E:'外向',I:'内向',S:'实感',N:'直觉',T:'理性',F:'情感',J:'计划',P:'随性'})[AXES[a][0]]+' '+pctFirst+'%', pct:pctFirst});
      rows.push({name:AXES[a][1]+' '+({E:'外向',I:'内向',S:'实感',N:'直觉',T:'理性',F:'情感',J:'计划',P:'随性'})[AXES[a][1]]+' '+(100-pctFirst)+'%', pct:100-pctFirst});
    }
    resultKey=code;
    autoBlocks.push({k:'radar', label:'你的四个维度', items:rows});
  }else{
    const ranked=Object.entries(t.scores).sort((a,b)=>b[1]-a[1]);
    resultKey=ranked[0][0];
  }
  const type = TYPES[resultKey] || TYPES[Object.keys(TYPES)[0]];
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const serial=Math.floor(1000+Math.random()*9000);
  $('reportNo').textContent=THEME.reportPrefix+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+serial;
  $('fSerial').textContent=serial;
  $('rEmoji').textContent=type.emoji;
  $('rName').textContent=type.name;
  $('rTag').textContent=type.tag;

  const body=$('rBody');
  body.innerHTML='';
  const blocks = autoBlocks.concat(type.blocks||[]);
  if(SHOW_MAPPING){
    const rows = Object.keys(TYPES).sort().map(k=>[k, TYPES[k].name]);
    blocks.push({k:'table', label:'16 型对照总表', head:['类型','最像的历史人物'], rows});
  }
  blocks.forEach(b=>body.appendChild(renderBlock(b)));

  show('screen-result');
  setTimeout(()=>document.querySelectorAll('.radar-fill').forEach(el=>el.style.width=el.dataset.w+'%'), 300);
}

function renderBlock(b){
  const sec=document.createElement('div');
  sec.className='r-sec';
  const h='<h3>'+b.label+'</h3>';
  if(b.k==='para'){ sec.innerHTML=h+'<p>'+b.text+'</p>'; }
  else if(b.k==='radar'){
    sec.innerHTML=h+'<div>'+b.items.map(it=>'<div class="radar-row"><span class="nm">'+it.name+'</span><span class="radar-track"><span class="radar-fill" data-w="'+Math.max(0,Math.min(100,it.pct))+'"></span></span><span class="pct">'+it.pct+'%</span></div>').join('')+'</div>';
  }
  else if(b.k==='list'){
    sec.innerHTML=h+b.items.map(it=>'<div class="item-card"><b>'+it.t+'</b>'+(it.d?'<div class="desc">'+it.d+'</div>':'')+(it.chips&&it.chips.length?'<div class="chips">'+it.chips.map(c=>'<span class="chip">'+c+'</span>').join('')+'</div>':'')+'</div>').join('');
  }
  else if(b.k==='quote'){ sec.innerHTML=h+'<div class="quote-box">'+b.text+'</div>'; }
  else if(b.k==='action'){ sec.innerHTML=h+'<div class="action-box"><div class="lab">'+b.label+'</div><p>'+b.text+'</p></div>'; }
  else if(b.k==='feed'){
    sec.innerHTML=h+b.items.map(it=>{
      const likes=(it.likes&&it.likes.length)?'<div class="feed-likes">❤️ <b>'+it.likes.join('、')+'</b> 觉得很赞</div>':'';
      const cmts=(it.comments&&it.comments.length)?'<div class="feed-cmts">'+it.comments.map(c=>'<div class="feed-cmt"><b>'+c.name+'：</b>'+c.text+'</div>').join('')+'</div>':'';
      return '<div class="feed-item"><div class="feed-top"><div class="feed-av">'+(it.avatar||'🙂')+'</div><div><div class="feed-nm">'+it.name+'</div><div class="feed-tm">'+it.time+'</div></div></div><div class="feed-tx">'+it.text+'</div>'+likes+cmts+'</div>';
    }).join('');
  }
  else if(b.k==='chat'){
    sec.innerHTML=h+'<div>'+b.lines.map(l=>{
      const side=(l.side==='r')?'r':'l';
      return '<div class="chat-item '+side+'"><div class="chat-nm">'+l.name+'</div><div class="chat-bubble">'+l.text+'</div></div>';
    }).join('')+'</div>';
  }
  else if(b.k==='table'){
    sec.innerHTML=h+'<table class="tbl"><thead><tr>'+b.head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+b.rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  }
  else { sec.innerHTML=h+'<p>'+JSON.stringify(b)+'</p>'; }
  return sec;
}

function shareResult(){
  if(!resultKey) return;
  const type=TYPES[resultKey]||{};
  const text=THEME.sharePre+type.emoji+type.name+'」——'+(type.tag||'');
  const url=location.href.split('#')[0];
  if(navigator.share){ navigator.share({title:document.title, text:text, url:url}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text+' '+url).then(()=>alert('结果文案已复制，去粘贴分享给朋友吧')).catch(()=>alert(text)); }
  else{ alert(text); }
}
</script>
